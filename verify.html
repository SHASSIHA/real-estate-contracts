<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحقق من العقد | شاصيها</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{
    font-family:'Cairo',sans-serif;
    background:#f1f1f1;
    text-align:center;
    padding:30px;
}
.box{
    background:white;
    max-width:400px;
    margin:auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px #ccc;
}
h1{
    color:#16a34a;
    font-size:25px;
}
.info{
    margin-top:20px;
    font-size:18px;
    line-height:2;
}
.logo{
    font-size:28px;
    font-weight:800;
}
</style>
</head>
<body>
<div class="box">
<div class="logo">
شاصيها
</div>
<h1>
✅ نسخة أصلية
</h1>
<div class="info">
رقم العقد:
<br>
<b id="contractId"></b>
<br><br>
تاريخ العقد:
<br>
<b id="contractDate"></b>
</div>
<p>
تم التحقق من العقد إلكترونياً عبر نظام شاصيها
</p>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const date = params.get("date");
document.getElementById("contractId").innerText =
id || "غير موجود";
document.getElementById("contractDate").innerText =
date || "غير موجود";
</script>
</body>
</html>
